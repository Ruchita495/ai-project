[project]
name = "ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "ipykernel>=7.3.0",
    "openai>=3.7.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "typing>=3.10.0.0",
]

[project.scripts]
ai-project = "ai_project:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
